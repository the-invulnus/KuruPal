name: Release packages

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: arm64
      - name: Check release version and architecture
        run: |
          test "$(uname -m)" = arm64
          python - <<'PY'
          import json, os
          version = json.load(open('src-tauri/tauri.conf.json'))['version']
          assert os.environ['GITHUB_REF_NAME'] == f'v{version}', 'Tag must match desktop version'
          PY
          rustup default stable
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r backend/requirements.txt
      - name: Test
        run: |
          npm test
          python -m unittest discover -s tests -p 'test_*.py'
          python -m unittest discover -s backend -p 'test_*.py'
      - name: Build app and packages
        run: |
          python scripts/build_sidecar.py
          cargo test --manifest-path src-tauri/Cargo.toml settings::tests
          npm run bundle -- --bundles app
          python scripts/package_macos.py
      - name: Publish both packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            releases/prepared/*.zip \
            releases/prepared/SHA256SUMS.txt \
            releases/prepared/INSTALL.md \
            --verify-tag --draft \
            --title "KuruPal ${GITHUB_REF_NAME#v}" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
          gh release edit "$GITHUB_REF_NAME" --draft=false
